            <!-- NOTIFICATION SETTINGS SECTION (shown when start_mode is 'notification') -->

                <div class="block-title">Notification Settings</div>
                <form class="list list-strong inset list-dividers-ios">
                    <ul>
                        <!-- clock_time -->
                        <li>
                            <div class="item-content item-input">
                                <div class="item-inner">

                                    <div class="item-input-wrap">
                                        <input type="text" name="clock_time" placeholder="12:34pm" />

                        <!-- background_type -->
                        <li>
                            <div class="item-content item-input">
                                <div class="item-inner">
                                    <div class="item-title item-label">Background</div>
                                    <div class="item-input-wrap">
                                        <select name="background_type">
                                            <option value="lockscreen">Lock Screen</option>
                                            <option value="website">Website</option>
                                            <option value="blank">Blank (Phone Off)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </li>

                        <!-- website_url (shown when background_type is 'website') -->
                        <li id="website_url_field">
                            <div class="item-content item-input">

                                </div>
                            </div>
                        </li>
                    </ul>
                </form>
            </div>

            <!-- FEATURED EMAIL SECTION -->
            <div class="block-title">Featured Email (Unread Message)</div>
            <form class="list list-strong inset list-dividers-ios">
                <ul>
                    <!-- sender_name -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Sender Name</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="featured_sender_name" placeholder="John Doe" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- sender_email -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Sender Email</div>
                                <div class="item-input-wrap">
                                    <input type="email" name="featured_sender_email" placeholder="john@example.com" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- sender_avatar -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-media">
                                <div class="avatar" id="featured_sender_avatar_preview"></div>
                            </div>
                            <div class="item-inner">

                    <!-- subject -->
                    <li>

                    <!-- sent_time -->
                    <li>

                    <!-- body -->
                    <li class="item-content item-input">

                                <textarea name="featured_body" placeholder="Email body text..." rows="8"></textarea>
                            </div>
                        </div>
                    </li>
                </ul>
            </form>

            <!-- INBOX EMAILS SECTION -->
            <div class="block-title">Inbox Emails
                <a href="#" id="add_inbox_email_button"><i class="f7-icons">plus_circle_fill</i></a>
            </div>
            <div class="list list-strong inset list-dividers-ios sortable sortable-enabled" id="inbox_emails_list">
                <ul></ul>

            <!-- use_random_inbox toggle -->

                                <div class="item-title">Use Random Inbox Emails</div>
                                <div class="item-after">
                                    <label class="toggle">
                                        <input type="checkbox" name="use_random_inbox" value="true" /><i class="toggle-icon"></i>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </form>

            <div class="block"><button id="delete_button" class="button button-fill color-red">Delete</button></div>

<!-- component styles -->
<style>
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        background-color: #ccc;
    }

    #featured_sender_avatar_preview {
        width: 60px;
        height: 60px;
    }

    .sortable-handler {
        cursor: grab;
    }
</style>

<!-- component logic -->
<script>
    export default (props, { $f7, $on }) => {
        let inboxEmailCounter = 0;

        $on('pageInit', () => {
            console.log('Email edit page initialized');

            // If editing existing sim, populate form
            if (currentSim && currentSim.type === 'email') {
                populateForm();
            } else {
                // Initialize new email sim with defaults
                currentSim = {
                    id: generateUniqueId(),
                    type: 'email',
                    name: 'New Email',
                    trigger_type: 'timed',
                    delay: 3,
                    sound_enabled: true,
                    vibration_enabled: true,
                    start_mode: 'notification',
                    clock_time: '12:34pm',
                    background_type: 'lockscreen',
                    website_url: '',
                    featured_email: {
                        sender_name: '',
                        sender_email: '',
                        sender_avatar: '',
                        subject: '',
                        sent_time: 'now',
                        body: ''
                    },
                    inbox_emails: [],
                    use_random_inbox: true
                };
            }

            // Populate inbox emails list
            populateInboxEmailsList();

            // Show/hide fields based on selections
            updateFieldVisibility();

            // Event listeners
            $$('[name="trigger_type"]').on('change', updateFieldVisibility);
            $$('[name="start_mode"]').on('change', updateFieldVisibility);
            $$('[name="background_type"]').on('change', updateFieldVisibility);

            // Play Now button
            $$('#play_now_button').on('click', () => {
                saveCurrentSim();
                mainView.router.navigate('/email/');
            });

            // Add inbox email button
            $$('#add_inbox_email_button').on('click', (e) => {
                e.preventDefault();
                addInboxEmail();
            });

            // Avatar upload
            $$('#featured_sender_avatar_upload').on('change', handleAvatarUpload);

            // Delete button
            $$('#delete_button').on('click', function (e) {
                e.preventDefault();
                deleteThisSim();
            });

            // Auto-save on input changes
            $$('.settings input, .settings select, .settings textarea').on('change', () => {
                saveCurrentSim();
            });
        });

        function populateForm() {
            // Populate basic fields
            $$('[name="name"]').val(currentSim.name || '');
            $$('[name="trigger_type"]').val(currentSim.trigger_type || 'timed');
            $$('[name="delay"]').val(currentSim.delay || 3);
            $$('[name="sound_enabled"]').prop('checked', currentSim.sound_enabled);
            $$('[name="vibration_enabled"]').prop('checked', currentSim.vibration_enabled);
            $$('[name="start_mode"]').val(currentSim.start_mode || 'notification');
            $$('[name="clock_time"]').val(currentSim.clock_time || '');
            $$('[name="background_type"]').val(currentSim.background_type || 'lockscreen');
            $$('[name="website_url"]').val(currentSim.website_url || '');
            $$('[name="use_random_inbox"]').prop('checked', currentSim.use_random_inbox);

            // Populate featured email
            if (currentSim.featured_email) {
                $$('[name="featured_sender_name"]').val(currentSim.featured_email.sender_name || '');
                $$('[name="featured_sender_email"]').val(currentSim.featured_email.sender_email || '');
                $$('[name="featured_subject"]').val(currentSim.featured_email.subject || '');
                $$('[name="featured_sent_time"]').val(currentSim.featured_email.sent_time || '');
                $$('[name="featured_body"]').val(currentSim.featured_email.body || '');
                
                if (currentSim.featured_email.sender_avatar) {
                    $$('#featured_sender_avatar_preview').css('background-image', `url(${currentSim.featured_email.sender_avatar})`);
                }
            }
        }

        function populateInboxEmailsList() {
            $$('#inbox_emails_list ul').html('');
            
            if (!currentSim.inbox_emails || currentSim.inbox_emails.length === 0) {
                return;
            }

            currentSim.inbox_emails.forEach((email, index) => {
                addInboxEmailToList(email, index);
            });
        }

        function addInboxEmailToList(email, index) {
            const emailItem = `
                <li data-email-index="${index}" class="swipeout">
                    <div class="item-content swipeout-content">
                        <div class="item-media sortable-handler"></div>
                        <div class="item-inner">
                            <div class="item-title-row">
                                <div class="item-title">${email.subject || 'No Subject'}</div>
                            </div>
                            <div class="item-subtitle">${email.sender_name || 'Unknown'} - ${email.sent_time || ''}</div>
                        </div>
                    </div>
                    <div class="swipeout-actions-right">
                        <a href="#" class="swipeout-delete">Delete</a>
                    </div>
                </li>
            `;
            $$('#inbox_emails_list ul').append(emailItem);
        }

        function addInboxEmail() {
            const email = {
                sender_name: 'Sender ' + (inboxEmailCounter + 1),
                sender_email: 'sender' + (inboxEmailCounter + 1) + '@example.com',
                sender_avatar: generateRandomAvatar(inboxEmailCounter),
                subject: 'Subject ' + (inboxEmailCounter + 1),
                sent_time: 'Yesterday',
                body: 'Email body text...',
                read: true
            };

            if (!currentSim.inbox_emails) {
                currentSim.inbox_emails = [];
            }

            currentSim.inbox_emails.push(email);
            addInboxEmailToList(email, currentSim.inbox_emails.length - 1);
            inboxEmailCounter++;
            saveCurrentSim();

            // Open edit sheet for the new email
            openInboxEmailEditSheet(currentSim.inbox_emails.length - 1);
        }

        function openInboxEmailEditSheet(index) {
            const email = currentSim.inbox_emails[index];

            const popup = $f7.popup.create({
                content: `
                    <div class="popup">
                        <div class="page">
                            <div class="navbar">
                                <div class="navbar-inner">
                                    <div class="title">Edit Inbox Email</div>
                                    <div class="right">
                                        <a class="link popup-close">Done</a>
                                    </div>
                                </div>
                            </div>
                            <div class="page-content">
                                <div class="list list-strong inset">
                                    <ul>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-title item-label">Sender Name</div>
                                                <div class="item-input-wrap">
                                                    <input type="text" class="inbox-sender-name" value="${email.sender_name || ''}" />
                                                </div>
                                            </div>
                                        </li>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-title item-label">Sender Email</div>
                                                <div class="item-input-wrap">
                                                    <input type="email" class="inbox-sender-email" value="${email.sender_email || ''}" />
                                                </div>
                                            </div>
                                        </li>
                                        <li class="item-content item-input">
                                            <div class="item-media">
                                                <div class="avatar inbox-sender-avatar-preview" style="background-image: url('${email.sender_avatar || ''}'); cursor: pointer;"></div>
                                            </div>
                                            <div class="item-inner">
                                                <div class="item-title item-label">Sender Image</div>
                                                <div class="item-input-wrap">
                                                    <input type="file" class="inbox-sender-avatar-upload" accept="image/*" />
                                                </div>
                                            </div>
                                        </li>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-title item-label">Subject</div>
                                                <div class="item-input-wrap">
                                                    <input type="text" class="inbox-subject" value="${email.subject || ''}" />
                                                </div>
                                            </div>
                                        </li>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-title item-label">Sent Time</div>
                                                <div class="item-input-wrap">
                                                    <input type="text" class="inbox-sent-time" value="${email.sent_time || ''}" />
                                                </div>
                                            </div>
                                        </li>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-title item-label">Body</div>
                                                <div class="item-input-wrap">
                                                    <textarea class="inbox-body" rows="6">${email.body || ''}</textarea>
                                                </div>
                                            </div>
                                        </li>
                                        <li>
                                            <div class="item-content">
                                                <div class="item-inner">
                                                    <div class="item-title">Mark as Read</div>
                                                    <div class="item-after">
                                                        <label class="toggle">
                                                            <input type="checkbox" class="inbox-read" ${email.read ? 'checked' : ''} />
                                                            <i class="toggle-icon"></i>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <div class="block">
                                    <button class="button button-fill color-red inbox-delete-button">Delete Email</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                on: {
                    opened: function() {
                        // Avatar upload handler
                        $$('.inbox-sender-avatar-upload').on('change', (e) => {
                            const file = e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = (event) => {
                                    const dataUrl = event.target.result;
                                    $$('.inbox-sender-avatar-preview').css('background-image', `url(${dataUrl})`);
                                    email.sender_avatar = dataUrl;
                                };
                                reader.readAsDataURL(file);
                            }
                        });

                        // Click avatar to generate random
                        $$('.inbox-sender-avatar-preview').on('click', () => {
                            const randomAvatar = generateRandomAvatar();
                            $$('.inbox-sender-avatar-preview').css('background-image', `url(${randomAvatar})`);
                            email.sender_avatar = randomAvatar;
                        });

                        // Delete button handler
                        $$('.inbox-delete-button').on('click', () => {
                            $f7.dialog.confirm('Delete this inbox email?', () => {
                                currentSim.inbox_emails.splice(index, 1);
                                saveCurrentSim();
                                populateInboxEmailsList();
                                popup.close();
                            });
                        });
                    },
                    closed: function() {
                        // Save changes when popup closes
                        email.sender_name = $$('.inbox-sender-name').val();
                        email.sender_email = $$('.inbox-sender-email').val();
                        email.subject = $$('.inbox-subject').val();
                        email.sent_time = $$('.inbox-sent-time').val();
                        email.body = $$('.inbox-body').val();
                        email.read = $$('.inbox-read').prop('checked');
                        
                        saveCurrentSim();
                        populateInboxEmailsList();
                    }
                }
            });

            popup.open();
        }

        // Handle clicking on inbox email items
        $on('pageInit', () => {
            $$('#inbox_emails_list').on('click', 'li:not(.swipeout-deleting)', (e) => {
                if (!$$(e.target).closest('.swipeout-actions-right').length && !$$(e.target).closest('.sortable-handler').length) {
                    const index = $$(e.target).closest('li').data('email-index');
                    openInboxEmailEditSheet(index);
                }
            });

            // Handle swipe delete
            $$('#inbox_emails_list').on('swipeout:deleted', (e) => {
                const index = $$(e.target).data('email-index');
                currentSim.inbox_emails.splice(index, 1);
                saveCurrentSim();
                populateInboxEmailsList();
            });
        });

        // Handle sortable reordering - attach after list is populated
        $on('pageAfterIn', () => {
            // Remove any existing handler
            $$('#inbox_emails_list').off('sortable:sort');
            
            // Attach sortable handler
            $$('#inbox_emails_list').on('sortable:sort', function(e) {
                console.log('Sortable sort event triggered');
                console.log('Total li elements:', $$('#inbox_emails_list ul li').length);
                
                // Get the new order from the DOM
                const sortedEmails = [];
                $$('#inbox_emails_list ul li').each(function(index) {
                    const emailIndex = $$(this).attr('data-email-index');
                    console.log('Li element:', index, 'has email-index:', emailIndex);
                    
                    if (emailIndex !== undefined && emailIndex !== null && currentSim.inbox_emails[emailIndex]) {
                        sortedEmails.push(currentSim.inbox_emails[emailIndex]);
                    }
                });
                
                console.log('Sorted emails:', sortedEmails.length);
                
                if (sortedEmails.length > 0) {
                    currentSim.inbox_emails = sortedEmails;
                    saveCurrentSim();
                    console.log('Saved sorted emails');
                    
                    // Update indices without full repopulate
                    $$('#inbox_emails_list ul li').each(function(index) {
                        $$(this).attr('data-email-index', index);
                    });
                }
            });
        });

        function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    $$('#featured_sender_avatar_preview').css('background-image', `url(${dataUrl})`);
                    currentSim.featured_email.sender_avatar = dataUrl;
                    saveCurrentSim();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateFieldVisibility() {
            const triggerType = $$('[name="trigger_type"]').val();
            const startMode = $$('[name="start_mode"]').val();
            const backgroundType = $$('[name="background_type"]').val();

            // Show/hide delay field
            if (triggerType === 'timed') {
                $$('#delay_field').show();
            } else {
                $$('#delay_field').hide();
            }

            // Show/hide notification settings
            if (startMode === 'notification') {
                $$('#notification_settings').show();
            } else {
                $$('#notification_settings').hide();
            }

            // Show/hide website URL field
            if (backgroundType === 'website') {
                $$('#website_url_field').show();
            } else {
                $$('#website_url_field').hide();
            }
        }

        function saveCurrentSim() {
            // Save basic fields
            currentSim.name = $$('[name="name"]').val() || 'Unnamed Email';
            currentSim.trigger_type = $$('[name="trigger_type"]').val();
            currentSim.delay = parseInt($$('[name="delay"]').val()) || 3;
            currentSim.sound_enabled = $$('[name="sound_enabled"]').prop('checked');
            currentSim.vibration_enabled = $$('[name="vibration_enabled"]').prop('checked');
            currentSim.start_mode = $$('[name="start_mode"]').val();
            currentSim.clock_time = $$('[name="clock_time"]').val();
            currentSim.background_type = $$('[name="background_type"]').val();
            currentSim.website_url = $$('[name="website_url"]').val();
            currentSim.use_random_inbox = $$('[name="use_random_inbox"]').prop('checked');

            // Save featured email
            if (!currentSim.featured_email) {
                currentSim.featured_email = {};
            }
            currentSim.featured_email.sender_name = $$('[name="featured_sender_name"]').val();
            currentSim.featured_email.sender_email = $$('[name="featured_sender_email"]').val();
            currentSim.featured_email.subject = $$('[name="featured_subject"]').val();
            currentSim.featured_email.sent_time = $$('[name="featured_sent_time"]').val();
            currentSim.featured_email.body = $$('[name="featured_body"]').val();

            // Save to appData
            appData.sims[currentSim.id] = currentSim;
            saveAppData();
            console.log('Email sim saved:', currentSim);
        }

        $on('pageBeforeRemove', () => {
            saveCurrentSim();
        });
        
        return $render
    };
</script>
