<script>
  export default (props, { $f7, $on }) => {
    const populateGlobalSettings = () => {
      console.log("Populating global settings:", appData.global);
      $$('#global-background')?.val(appData.global.background);
      $$('#global-os').val(appData.global.os);
      $$('#global-dark_mode').prop('checked', appData.global.dark_mode ? 'checked' : '');
      $$('#global-remote_channel').val(appData.global.remote_channel || 'default');
      $$('#global-player_slot').val(appData.global.player_slot || 'player1');
      $$('#global-alert_sound').val(appData.global.alert_sound || 'alert1');
      $$('#global-ringtone_sound').val(appData.global.ringtone_sound || 'ringtone_1');
      $$('#global-analytics_enabled').prop('checked', appData.global.analytics_enabled ? 'checked' : '');
    };

    const updateGlobalSettings = () => {
      const newOS = $$('#global-os').val();
      const newDarkMode = $$('#global-dark_mode').prop('checked');

      // Apply theme changes immediately
      if (newOS !== appData.global.os) {
        appData.global.os = newOS;
        applyTheme(newOS);
      }

      if (newDarkMode !== appData.global.dark_mode) {
        appData.global.dark_mode = newDarkMode;
        applyDarkMode(newDarkMode);
      }

      appData.global.remote_channel = $$('#global-remote_channel').val() || 'default';
      appData.global.player_slot = $$('#global-player_slot').val() || 'player1';
      appData.global.alert_sound = $$('#global-alert_sound').val() || 'alert1';
      appData.global.ringtone_sound = $$('#global-ringtone_sound').val() || 'ringtone_1';
      
      // Handle analytics toggle
      const newAnalyticsEnabled = $$('#global-analytics_enabled').prop('checked');
      if (newAnalyticsEnabled !== appData.global.analytics_enabled) {
        appData.global.analytics_enabled = newAnalyticsEnabled;
        loadAnalyticsScript(); // Reload analytics script based on new setting
      }
      
      console.log('Global settings updated:', appData.global);
      saveAppData();
    };

    const setupBackgroundImageUpload = () => {
      const fileInput = $$('#background_img_upload');
      const previewContainer = $$('#background_img_preview_container');
      const previewImg = $$('#background_img_preview');
      const clearBtn = $$('#background_img_clear');

      if (appData.global.background_img && appData.global.background_img.startsWith('data:')) {
        previewImg.attr('src', appData.global.background_img);
        previewContainer.css('display', 'block');
      }

      fileInput.off('change');
      fileInput.on('change', function (e) {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
          resizeImageToBase64(file, 1080, 1920, 0.5)
            .then((base64Data) => {
              previewImg.attr('src', base64Data);
              previewContainer.css('display', 'block');
              appData.global.background_img = base64Data;
              saveAppData();
              console.log('Background image uploaded and stored successfully');
            })
            .catch((error) => {
              app.notification.create({
                title: 'Error',
                text: 'Failed to upload image',
                closeTimeout: 2000,
                closeOnClick: true,
              }).open();
              console.error('Error uploading image:', error);
            });
        } else {
          app.notification.create({
            title: 'Invalid File',
            text: 'Please select a valid image file',
            closeTimeout: 2000,
            closeOnClick: true,
          }).open();
        }
      });

      clearBtn.off('click');
      clearBtn.on('click', function (e) {
        e.preventDefault();
        fileInput.val('');
        previewContainer.css('display', 'none');
        appData.global.background_img = generateRandomBackground();
        saveAppData();
        console.log('Background image cleared');
      });
    };

    $on('pageBeforeOut', function (e, page) {
      updateGlobalSettings();
    });

    $on('pageBeforeIn', function (e, page) {
      populateGlobalSettings();
      setupBackgroundImageUpload();

      // Add event listeners for immediate theme/mode changes
      $$('#global-os').off('change').on('change', updateGlobalSettings);
      $$('#global-dark_mode').off('change').on('change', updateGlobalSettings);

      // Add event listeners to preview sounds when changed
      $$('#global-alert_sound').off('change').on('change', function () {
        updateGlobalSettings();
        playNotificationSound();
      });

      $$('#global-ringtone_sound').off('change').on('change', function () {
        updateGlobalSettings();
        // Play ringtone preview for 2 seconds
        const sound = playRingtone();
        setTimeout(() => {
          if (sound) stopSound(sound);
        }, 2000);
      });

      // Add reset app button handler
      $$('#reset-app-btn').off('click').on('click', function (e) {
        e.preventDefault();
        resetApp();
      });
    });

    // component function must return render function
    return $render;
  };
</script>
