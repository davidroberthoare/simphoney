<!-- component logic -->
<script>
  export default (props, { $f7, $on }) => {
    let peer = null;
    let peerId = null;
    const remoteChannel = appData.global.remote_channel || 'default';
    let ringtoneSound = null;

    // Function to play ringtone
    function playCallRingtone() {
      // Try to play custom ringtone if provided
      if (currentSim.custom_ringtone && currentSim.custom_ringtone.startsWith('data:')) {
        if (typeof Howl !== 'undefined') {
          ringtoneSound = new Howl({
            src: [currentSim.custom_ringtone],
            loop: true,
            volume: 0.7
          });
          ringtoneSound.play();
        } else {
          ringtoneSound = new Audio(currentSim.custom_ringtone);
          ringtoneSound.loop = true;
          ringtoneSound.play().catch(err => console.warn('Failed to play custom ringtone:', err));
        }
      } else {
        // Use global ringtone setting
        ringtoneSound = playRingtone();
      }
    }
    
    function stopCallRingtone() {
      if (ringtoneSound) {
        stopSound(ringtoneSound);
        ringtoneSound = null;
      }
    }
    
    function triggerVibrationPattern() {
      if ('vibrate' in navigator) {
        // Repeated vibration pattern for incoming call
        const vibrate = () => {
          navigator.vibrate([1000, 500, 1000, 500]);
          if ($$('#call_overlay').css('display') !== 'none') {
            setTimeout(vibrate, 3000);
          }
        };
        vibrate();
      }
    }

    // Function to trigger the call overlay
    function triggerCall() {
      $$('#call_overlay').css('display', 'flex');
      playCallRingtone();
      triggerVibrationPattern();
    }
    
    let callTimer = null;
    let callSeconds = 0;
    
    function answerCall() {
      stopCallRingtone();
      navigator.vibrate && navigator.vibrate(0); // Stop vibration
      $$('#call_overlay').hide();
      $$('#in_call_screen').css('display', 'flex');
      
      // Start call duration timer
      callSeconds = 0;
      updateCallDuration();
      callTimer = setInterval(() => {
        callSeconds++;
        updateCallDuration();
      }, 1000);
    }
    
    function updateCallDuration() {
      const minutes = Math.floor(callSeconds / 60);
      const seconds = callSeconds % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      $$('#call_duration').text(formatted);
    }
    
    function declineCall() {
      stopCallRingtone();
      navigator.vibrate && navigator.vibrate(0); // Stop vibration
      $$('#call_overlay').hide();
      
      // Show a notification that call was declined
      app.notification.create({
        title: 'Call Declined',
        text: `Declined call from ${currentSim.caller_name}`,
        closeTimeout: 2000,
        closeOnClick: true,
      }).open();
    }
    
    function hangupCall() {
      // Stop call timer
      if (callTimer) {
        clearInterval(callTimer);
        callTimer = null;
      }
      
      $$('#in_call_screen').hide();
      
      // Show call ended notification
      const minutes = Math.floor(callSeconds / 60);
      const seconds = callSeconds % 60;
      const duration = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
      
      app.notification.create({
        title: 'Call Ended',
        text: `Call duration: ${duration}`,
        closeTimeout: 2000,
        closeOnClick: true,
      }).open();
      
      callSeconds = 0;
    }

    $on('pageBeforeIn', function (e, page) {
      console.log('Preparing incoming call page...');
      if (!currentSim || currentSim.type !== 'call_in') {
        console.error('No valid incoming call sim');
        return;
      }
      
      // Preload ringtone
      if (!currentSim.custom_ringtone || !currentSim.custom_ringtone.startsWith('data:')) {
        const ringtone = appData.global.ringtone_sound || 'ringtone_1';
        preloadSound(`sounds/${ringtone}.mp3`, ringtone);
      }
      
      // Set background
      if (appData.global.background_img) {
        $$('.page[data-name="call_in"]').css('background-image', `url(${appData.global.background_img})`);
      } else {
        $$('.page[data-name="call_in"]').css('background-image', 'none');
      }
      
      // Hide/show elements based on settings
      if (currentSim.background_type === 'website' && currentSim.website_url.trim() !== '') {
        $$('#website').attr('src', currentSim.website_url);
        $$('#website').show();
        $$('#call_overlay').css('background', 'rgba(0, 0, 0, 0.85)');
      } else if (currentSim.background_type === 'lockscreen') {
        $$('#website').hide();
        $$('#call_overlay').css('background', 'rgba(0, 0, 0, 0.95)');
        
        if (currentSim.clock_time && currentSim.clock_time.trim() !== '') {
          $$('#clock').show();
        } else {
          $$('#clock').hide();
        }
      }
    });

    $on('pageAfterIn', function (e, page) {
      console.log('Incoming call page displayed...', currentSim);
      if (!currentSim || currentSim.type !== 'call_in') {
        console.error('No valid incoming call sim');
        return;
      }

      // Set up button handlers
      $$('#accept_button').off('click').on('click', answerCall);
      $$('#decline_button').off('click').on('click', declineCall);
      
      // In-call screen button handlers
      $$('#hangup_button').off('click').on('click', hangupCall);
      
      $$('#mute_button').off('click').on('click', function() {
        $$(this).toggleClass('active');
        const isMuted = $$(this).hasClass('active');
        $$(this).find('span').text(isMuted ? 'Unmute' : 'Mute');
      });
      
      $$('#speaker_button').off('click').on('click', function() {
        $$(this).toggleClass('active');
        const isOn = $$(this).hasClass('active');
        $$(this).find('span').text(isOn ? 'Speaker On' : 'Speaker Off');
      });
      
      $$('#keypad_button').off('click').on('click', function() {
        // Keypad functionality could be added here
        app.notification.create({
          title: 'Keypad',
          text: 'Keypad feature coming soon',
          closeTimeout: 1500,
          closeOnClick: true,
        }).open();
      });

      // Trigger call based on type
      if (currentSim.trigger_type === 'timed') {
        setTimeout(() => {
          triggerCall();
        }, currentSim.delay * 1000);
      } else {
        // Remote trigger
        let playerSlot = appData.global.player_slot || 'player1';
        peerId = `simphoney-${remoteChannel}-${playerSlot}`;
        peer = new Peer(peerId);

        peer.on('open', (id) => {
          console.log(`PeerJS connected - Channel: ${remoteChannel}, Slot: ${playerSlot}, ID: ${id}`);
        });

        peer.on('connection', (conn) => {
          console.log('Remote connection established');
          conn.on('data', (data) => {
            console.log('Received data from remote:', data);
            if (data === 'go') {
              triggerCall();
            }
          });
        });

        peer.on('error', (err) => {
          console.error('PeerJS error:', err);
        });
      }
    });

    $on('pageBeforeOut', function (e, page) {
      // Clean up
      stopCallRingtone();
      navigator.vibrate && navigator.vibrate(0);
      
      // Clean up call timer
      if (callTimer) {
        clearInterval(callTimer);
        callTimer = null;
      }
      
      if (peer) {
        peer.destroy();
        peer = null;
        peerId = null;
        console.log('PeerJS connection closed');
      }
    });

    // component function must return render function
    return $render;
  };
</script>
