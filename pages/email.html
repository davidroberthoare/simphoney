<!-- component logic -->
<script>
  export default (props, { $f7, $on }) => {
    let peer = null;
    let peerId = null;
    const remoteChannel = appData.global.remote_channel || 'default';
    let allEmails = [];
    let currentView = 'inbox';
    let currentEmailIndex = -1;
    let composeMode = 'new'; // 'new', 'reply', 'forward'

    // Generate random inbox emails
    function generateRandomInboxEmails(count = 10) {
      const subjects = [
        'Meeting Tomorrow at 2 PM',
        'Project Update Required',
        'Weekly Report',
        'Important: Action Required',
        'RE: Your question',
        'Invoice #12345',
        'Newsletter - March 2026',
        'Reminder: Deadline Approaching',
        'FW: Team Announcement',
        'Account Security Alert',
        'New Message from Support',
        'Your Order Has Shipped',
        'Invitation: Company Event'
      ];

      const previews = [
        'Hi, I hope this email finds you well...',
        'Following up on our conversation...',
        'Please review the attached document...',
        'This is a reminder that...',
        'I wanted to reach out to discuss...',
        'Thank you for your email...',
        'Just wanted to let you know...',
        'Quick question about...',
        'Please find attached...',
        'I hope you\'re having a great day...'
      ];

      const times = ['8:23 AM', '9:45 AM', 'Yesterday', 'Yesterday', 'Monday', 'Monday', 'Sunday', 'Mar 15', 'Mar 14', 'Mar 13'];

      const emails = [];
      const contacts = generateContacts(count);

      for (let i = 0; i < count; i++) {
        emails.push({
          sender_name: contacts[i].fullname,
          sender_email: contacts[i].email,
          sender_avatar: contacts[i].picture.medium,
          subject: subjects[i % subjects.length],
          sent_time: times[i % times.length],
          body: previews[i % previews.length] + '\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\n\nBest regards,\n' + contacts[i].fullname,
          preview: previews[i % previews.length],
          read: true
        });
      }

      return emails;
    }

    // Populate inbox
    function populateInbox() {
      $$('#inbox_list ul').html('');
      
      allEmails.forEach((email, index) => {
        const emailItem = `
          <li class="email-item ${email.read ? '' : 'unread'}" data-email-index="${index}">
            <a href="#" class="item-link item-content">
              <div class="item-media">
                <div class="email-avatar-thumb" style="background-image: url('${email.sender_avatar}')"></div>
              </div>
              <div class="item-inner">
                <div class="item-title-row">
                  <div class="item-title">${email.sender_name}</div>
                  <div class="item-after">${email.sent_time}</div>
                </div>
                <div class="item-subtitle">${email.subject}</div>
                <div class="item-text">${email.preview || email.body.substring(0, 50) + '...'}</div>
              </div>
            </a>
          </li>
        `;
        $$('#inbox_list ul').append(emailItem);
      });

      // Add click handlers
      $$('.email-item').on('click', function(e) {
        e.preventDefault();
        const index = $$(this).data('email-index');
        openEmail(index);
      });
    }

    // Open email reader
    function openEmail(index) {
      currentEmailIndex = index;
      const email = allEmails[index];
      
      // Mark as read
      email.read = true;
      
      // Populate reader view
      $$('.email-subject').text(email.subject);
      $$('.email-from-name').text(email.sender_name);
      $$('.email-from-email').text(email.sender_email);
      $$('.email-time').text(email.sent_time);
      $$('.email-avatar').css('background-image', `url('${email.sender_avatar}')`);
      $$('.email-body').text(email.body);
      
      // Switch to reader view
      showView('reader');
    }

    // Show compose view
    function showCompose(mode = 'new', emailIndex = -1) {
      composeMode = mode;
      
      if (mode === 'reply' && emailIndex >= 0) {
        const email = allEmails[emailIndex];
        $$('#compose_to').val(email.sender_email);
        $$('#compose_subject').val('Re: ' + email.subject);
        $$('#compose_body').val('\n\n---\nOn ' + email.sent_time + ', ' + email.sender_name + ' wrote:\n' + email.body);
      } else if (mode === 'forward' && emailIndex >= 0) {
        const email = allEmails[emailIndex];
        $$('#compose_to').val('');
        $$('#compose_subject').val('Fwd: ' + email.subject);
        $$('#compose_body').val('\n\n---\nForwarded message from ' + email.sender_name + ':\n' + email.body);
      } else {
        $$('#compose_to').val('');
        $$('#compose_subject').val('');
        $$('#compose_body').val('');
      }
      
      showView('compose');
    }

    // Send email
    function sendEmail() {
      // Play sound if enabled
      if (currentSim.sound_enabled) {
        playSMSSound();
      }
      
      // Show sending notification
      $f7.notification.create({
        icon: '<i class="f7-icons">paperplane</i>',
        title: 'Email',
        text: 'Sending...',
        closeTimeout: 1000,
      }).open();
      
      // After a short delay, show sent notification
      setTimeout(() => {
        $f7.notification.create({
          icon: '<i class="f7-icons">checkmark_circle</i>',
          title: 'Email',
          text: 'Message Sent',
          closeTimeout: 2000,
        }).open();
        
        // Return to inbox
        showView('inbox');
      }, 1000);
    }

    // Switch views
    function showView(view) {
      currentView = view;
      
      $$('#website').hide();
      $$('#inbox_view').hide();
      $$('#reader_view').hide();
      $$('#compose_view').hide();
      
      const navbar = $$('#email_navbar');
      const navbarTitle = $$('#email_navbar_title');
      const pageContent = $$('#main_page_content');
      
      if (view === 'inbox') {
        $$('#inbox_view').show();
        navbar.addClass('navbar-with-bg').show();
        navbarTitle.text('Inbox').show();
        $$('#compose_button').show();
        pageContent.css('padding-top', '');
        populateInbox(); // Refresh to show read/unread states
      } else if (view === 'reader') {
        $$('#reader_view').show();
        navbar.removeClass('navbar-with-bg').hide();
        $$('#compose_button').hide();
        pageContent.css('padding-top', '0');
      } else if (view === 'compose') {
        $$('#compose_view').show();
        navbar.removeClass('navbar-with-bg').hide();
        $$('#compose_button').hide();
        pageContent.css('padding-top', '0');
      }
    }

    // Trigger notification
    function triggerNotification() {
      // Play sound effect if enabled
      if (currentSim.sound_enabled) {
        playNotificationSound();
      }
      
      // Trigger vibration if enabled
      if (currentSim.vibration_enabled) {
        triggerVibration();
      }
      
      const featuredEmail = currentSim.featured_email;
      
      let notification = $f7.notification.create({
        icon: `<div class="avatar" style="background-image: url('${featuredEmail.sender_avatar || generateRandomAvatar()}'); width: 40px; height: 40px; border-radius: 50%; background-size: cover;"></div>`,
        title: featuredEmail.sender_name || 'New Email',
        subtitle: featuredEmail.subject || 'No Subject',
        titleRightText: featuredEmail.sent_time || 'now',
        text: featuredEmail.body.substring(0, 50) + '...',
        closeOnClick: true,
        swipeToClose: true,
        on: {
          click: function() {
            // When notification is clicked, open the featured email
            openEmail(0); // Featured email is always first
          }
        }
      });
      notification.open();
    }

    $on('pageBeforeIn', function (e, page) {
      console.log('Preparing email page...');
      if (!currentSim || currentSim.type !== 'email') {
        console.error('No valid email sim');
        return;
      }
      
      // Preload alert sound if enabled
      if (currentSim.sound_enabled) {
        const alertSound = appData.global.alert_sound || 'alert1';
        preloadSound(`sounds/${alertSound}.mp3`, alertSound);
      }
      
      // Setup background for notification mode
      if (currentSim.start_mode === 'notification') {
        if (appData.global.background_img) {
          $$('.page[data-name="email"]').css('background-image', `url(${appData.global.background_img})`);
        } else {
          $$('.page[data-name="email"]').css('background-image', 'none');
        }
      }
    });

    $on('pageAfterIn', function (e, page) {
      console.log('Email page displayed...', currentSim);
      if (!currentSim || currentSim.type !== 'email') {
        console.error('No valid email sim');
        return;
      }
      
      // Hide navbar and remove padding initially
      $$('#email_navbar').hide();
      $$('#main_page_content').css('padding-top', '0');

      // Build email list
      allEmails = [];
      
      // Add featured email first (as unread)
      if (currentSim.featured_email) {
        allEmails.push({
          ...currentSim.featured_email,
          preview: currentSim.featured_email.body.substring(0, 50) + '...',
          read: false
        });
      }
      
      // Add custom inbox emails if not using random
      if (!currentSim.use_random_inbox && currentSim.inbox_emails && currentSim.inbox_emails.length > 0) {
        allEmails.push(...currentSim.inbox_emails);
      } else {
        // Generate random inbox emails
        allEmails.push(...generateRandomInboxEmails(10));
      }

      // Setup event handlers
      $$('#back_to_inbox').on('click', (e) => {
        e.preventDefault();
        showView('inbox');
      });

      $$('#reply_button').on('click', (e) => {
        e.preventDefault();
        showCompose('reply', currentEmailIndex);
      });

      $$('#forward_button').on('click', (e) => {
        e.preventDefault();
        showCompose('forward', currentEmailIndex);
      });

      $$('#delete_button').on('click', (e) => {
        e.preventDefault();
        $f7.dialog.confirm('Delete this message?', () => {
          allEmails.splice(currentEmailIndex, 1);
          showView('inbox');
        });
      });

      $$('#compose_button').on('click', (e) => {
        e.preventDefault();
        showCompose('new');
      });

      $$('#cancel_compose').on('click', (e) => {
        e.preventDefault();
        if (currentEmailIndex >= 0) {
          showView('reader');
        } else {
          showView('inbox');
        }
      });

      $$('#send_button').on('click', (e) => {
        e.preventDefault();
        sendEmail();
      });

      // Determine start mode
      if (currentSim.start_mode === 'notification') {
        // Hide navbar for notification mode
        $$('#email_navbar').removeClass('navbar-with-bg').hide();
        $$('#email_navbar_title').hide();
        $$('#main_page_content').css('padding-top', '0');
        
        // Show background elements
        if (currentSim.background_type === 'lockscreen') {
          if (currentSim.clock_time) {
            $$('#clock').text(currentSim.clock_time).show();
          }
        } else if (currentSim.background_type === 'website' && currentSim.website_url) {
          $$('#website').attr('src', currentSim.website_url).show();
          // Ensure navbar and views stay hidden when website is the background
          $$('#email_navbar').hide();
          $$('#inbox_view').hide();
          $$('#reader_view').hide();
          $$('#compose_view').hide();
        }
        
        
        // Trigger notification based on trigger type
        if (currentSim.trigger_type === 'timed') {
          const delay = (currentSim.delay || 3) * 1000;
          setTimeout(() => {
            triggerNotification();
          }, delay);
        } else if (currentSim.trigger_type === 'remote') {
          // Setup peer connection for remote trigger
          setupPeerConnection();
        }
      } else {
        // Start directly in inbox
        populateInbox();
        showView('inbox');
      }
    });

    // Remote control setup
    function setupPeerConnection() {
      if (typeof Peer === 'undefined') {
        console.error('PeerJS library not loaded');
        return;
      }

      const playerId = appData.global.player_slot || 'player1';
      peerId = `simphoney_email_${remoteChannel}_${playerId}`;

      peer = new Peer(peerId);

      peer.on('open', (id) => {
        console.log('Email peer connection established:', id);
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          console.log('Received remote command:', data);
          if (data.action === 'trigger' && data.simId === currentSim.id) {
            triggerNotification();
          }
        });
      });

      peer.on('error', (err) => {
        console.error('Peer connection error:', err);
      });
    }

    $on('pageBeforeRemove', () => {
      // Cleanup peer connection
      if (peer) {
        peer.destroy();
        peer = null;
      }
    });
    
    return $render
  };
</script>
