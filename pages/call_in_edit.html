    <div data-name="call_in_edit" class="page">
        <div class="navbar">
            <div class="navbar-inner">
                <div class="left">
                    <a href="/" class="link back"><i class="f7-icons">chevron_left</i></a>
                </div>
                <div class="title">Incoming Call Edit</div>
            </div>
        </div>
        <div class="page-content">
            <div class="block"><button id="play_now_button" class="button button-fill color-green">Play Now</button></div>

            <form class="list list-strong inset list-dividers-ios settings">
                <ul>
                    <!-- sim_name -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Name</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="name" placeholder="Incoming Call Name" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- caller name -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Caller Name</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="caller_fullname" placeholder="Caller Name" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- caller number -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Caller Number</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="caller_phone" placeholder="+1 (555) 123-4567" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- caller_avatar -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-media">
                                <div class="avatar" id="caller_avatar_preview"></div>
                            </div>
                            <div class="item-inner">
                                <div class="item-title item-label">Caller Avatar</div>
                                <div class="item-input-wrap">
                                    <input type="file" id="caller_avatar_upload" name="caller_avatar_upload" accept="image/*" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- trigger_type selector timed/remote-->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Trigger Type</div>
                                <div class="item-input-wrap">
                                    <select name="trigger_type">
                                        <option value="timed">Timed</option>
                                        <option value="remote">Remote</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- delay -->
                    <li id="delay_field">
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Delay (seconds)</div>
                                <div class="item-input-wrap">
                                    <input type="number" name="delay" placeholder="3" value="3" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- clock_time -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Clock Time (blank if not shown)</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="clock_time" placeholder="Clock Time" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- background type -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Background Type</div>
                                <div class="item-input-wrap">
                                    <select name="background_type">
                                        <option value="lockscreen">Lock-Screen</option>
                                        <option value="website">Website</option>
                                        <option value="blank">Blank (Phone Off)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- website_url -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Website URL</div>
                                <div class="item-input-wrap">
                                    <input type="text" name="website_url" placeholder="Website URL" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- custom ringtone -->
                    <li>
                        <div class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-title item-label">Custom Ringtone (optional)</div>
                                <div class="item-input-wrap">
                                    <input type="file" id="ringtone_upload" name="ringtone_upload" accept="audio/*" />
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- ringtone preview/clear -->
                    <li id="ringtone_preview_container" style="display: none;">
                        <div class="item-content">
                            <div class="item-inner">
                                <button type="button" id="ringtone_play" class="button button-outline">Play Ringtone</button>
                                <button type="button" id="ringtone_clear" class="button button-outline" style="margin-left: 8px;">Clear Ringtone</button>
                            </div>
                        </div>
                    </li>

                </ul>
            </form>

            <div class="block"><button class="button button-fill color-red" onclick="deleteThisSim()">Delete</button></div>
        </div>
    </div>
</template>

<!-- component styles -->
<style>
    #caller_avatar_preview {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        cursor: pointer;
    }
</style>

<!-- component logic -->
<script>
    export default (props, { $f7, $on }) => {
        console.log("incoming call edit component loaded");
        let ringtoneAudio = null;
        
        const updateCallSettings = () => {
            const $settings = $$('form.list.settings');
            try {
                if (currentSim) {
                    currentSim.name = $settings.find('input[name="name"]').val();
                    // Update caller fullname and split into first/last
                    const callerFullname = $settings.find('input[name="caller_fullname"]').val();
                    const nameParts = callerFullname.split(' ');
                    currentSim.caller.name.first = nameParts[0] || '';
                    currentSim.caller.name.last = nameParts.slice(1).join(' ') || '';
                    currentSim.caller.fullname = callerFullname;
                    currentSim.caller.phone = $settings.find('input[name="caller_phone"]').val();
                    currentSim.trigger_type = $settings.find('select[name="trigger_type"]').val();
                    currentSim.delay = $settings.find('input[name="delay"]').val();
                    currentSim.clock_time = $settings.find('input[name="clock_time"]').val();
                    currentSim.background_type = $settings.find('select[name="background_type"]').val();
                    currentSim.website_url = $settings.find('input[name="website_url"]').val();
                    console.log('Incoming call settings updated:', currentSim);
                    appData.sims[currentSim.id] = currentSim;
                    saveAppData();
                }
            } catch (error) {
                console.log("Error updating incoming call settings:", error);
            }
        };

        const playThisSim = () => {
            updateCallSettings();
            console.log("Playing this sim now:", currentSim);
            enterFullscreen();
            mainView.router.navigate('/' + currentSim.type + '/');
        };

        const setupCallerImageUpload = () => {
            const fileInput = $$('#caller_avatar_upload');
            const previewImg = $$('#caller_avatar_preview');

            if (currentSim.caller.picture.medium && currentSim.caller.picture.medium.startsWith('data:')) {
                previewImg.css('background-image', `url(${currentSim.caller.picture.medium})`);
            }

            fileInput.on('change', function (e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    resizeImageToBase64(file)
                        .then((base64Data) => {
                            previewImg.css('background-image', `url(${base64Data})`);
                            currentSim.caller.picture.medium = base64Data;
                            console.log('Caller avatar uploaded and stored successfully');
                        })
                        .catch((error) => {
                            app.notification.create({
                                title: 'Error',
                                text: 'Failed to upload image',
                                closeTimeout: 2000,
                                closeOnClick: true,
                            }).open();
                            console.error('Error uploading image:', error);
                        });
                } else {
                    app.notification.create({
                        title: 'Invalid File',
                        text: 'Please select a valid image file',
                        closeTimeout: 2000,
                        closeOnClick: true,
                    }).open();
                }
            });

            previewImg.on('click', function (e) {
                fileInput.val('');
                currentSim.caller.picture.medium = generateRandomAvatar();
                previewImg.css('background-image', `url(${currentSim.caller.picture.medium})`);
                console.log('Avatar reset');
            });
        };

        const setupRingtoneUpload = () => {
            const fileInput = $$('#ringtone_upload');
            const previewContainer = $$('#ringtone_preview_container');
            const playBtn = $$('#ringtone_play');
            const clearBtn = $$('#ringtone_clear');

            if (currentSim.custom_ringtone && currentSim.custom_ringtone.startsWith('data:')) {
                previewContainer.show();
            }

            fileInput.on('change', function (e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('audio/')) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        currentSim.custom_ringtone = e.target.result;
                        previewContainer.show();
                        saveAppData();
                        console.log('Ringtone uploaded successfully');
                    };
                    reader.onerror = function () {
                        app.notification.create({
                            title: 'Error',
                            text: 'Failed to upload ringtone',
                            closeTimeout: 2000,
                            closeOnClick: true,
                        }).open();
                    };
                    reader.readAsDataURL(file);
                } else {
                    app.notification.create({
                        title: 'Invalid File',
                        text: 'Please select a valid audio file',
                        closeTimeout: 2000,
                        closeOnClick: true,
                    }).open();
                }
            });

            playBtn.off('click').on('click', function (e) {
                e.preventDefault();
                if (ringtoneAudio) {
                    ringtoneAudio.pause();
                    ringtoneAudio = null;
                    playBtn.text('Play Ringtone');
                } else if (currentSim.custom_ringtone) {
                    ringtoneAudio = new Audio(currentSim.custom_ringtone);
                    ringtoneAudio.play();
                    playBtn.text('Stop Ringtone');
                    ringtoneAudio.onended = () => {
                        ringtoneAudio = null;
                        playBtn.text('Play Ringtone');
                    };
                }
            });

            clearBtn.off('click').on('click', function (e) {
                e.preventDefault();
                if (ringtoneAudio) {
                    ringtoneAudio.pause();
                    ringtoneAudio = null;
                }
                fileInput.val('');
                previewContainer.hide();
                currentSim.custom_ringtone = '';
                saveAppData();
                playBtn.text('Play Ringtone');
                console.log('Ringtone cleared');
            });
        };

        const show_hide_website_url_field = () => {
            console.log('Checking background type for website URL field display');
            const backgroundType = $$('select[name="background_type"]').val();
            if (backgroundType === 'website') {
                $$('input[name="website_url"]').closest('li').show();
            } else {
                $$('input[name="website_url"]').closest('li').hide();
            }
        };

        const show_hide_delay_field = () => {
            console.log('Checking trigger type for delay field display');
            const triggerType = $$('select[name="trigger_type"]').val();
            if (triggerType === 'remote') {
                $$('#delay_field').hide();
            } else {
                $$('#delay_field').show();
            }
        };

        $on('pageInit', function (e, page) {
            setupCallerImageUpload();
            setupRingtoneUpload();

            $$("#play_now_button").on('click', function (e) {
                e.preventDefault();
                playThisSim();
            });

            $$('select[name="background_type"]').on('change', function () {
                show_hide_website_url_field();
            });

            $$('select[name="trigger_type"]').on('change', function () {
                show_hide_delay_field();
            });
        });

        $on('pageBeforeIn', function (e, page) {
            const s = currentSim;
            console.log('Incoming call edit page displayed...', s);
            const $settings = $$('form.list.settings');
            $settings.find('input[name="name"]').val(s.name);
            $settings.find('input[name="caller_fullname"]').val(s.caller.fullname);
            $settings.find('input[name="caller_phone"]').val(s.caller.phone);
            $settings.find('input[name="clock_time"]').val(s.clock_time);
            $settings.find('input[name="delay"]').val(s.delay);
            $settings.find('select[name="trigger_type"]').val(s.trigger_type);
            $settings.find('select[name="background_type"]').val(s.background_type);
            $settings.find('input[name="website_url"]').val(s.website_url);

            $$("#caller_avatar_preview").css('background-image', `url(${s.caller.picture.medium})`);
            
            if (s.custom_ringtone && s.custom_ringtone.startsWith('data:')) {
                $$('#ringtone_preview_container').show();
            } else {
                $$('#ringtone_preview_container').hide();
            }
            
            show_hide_website_url_field();
            show_hide_delay_field();
        });

        $on('pageBeforeOut', function (e, page) {
            // Stop any playing ringtone
            if (ringtoneAudio) {
                ringtoneAudio.pause();
                ringtoneAudio = null;
            }
            updateCallSettings();
        });

        // component function must return render function
        return $render;
    };
</script>
