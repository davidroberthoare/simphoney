<!-- REMOTE CONTROLLER COMPONENT -->
<template>
  <div data-name="remote" class="page">
    <div class="navbar">
      <div class="navbar-inner">
        <div class="left">
          <a href="/" class="link back"><i class="f7-icons">chevron_left</i></a>
        </div>
        <div class="title">Remote Control</div>
      </div>
    </div>
    <div class="page-content">
      <div class="block">
        <p style="font-size: 0.9em; color: #666; text-align: center; margin: 0;"><i class="f7-icons" style="font-size: 14px;">info_circle</i> Both devices must be on the same WiFi or LAN connection, and have the same Channel Name set in Settings, to find each other.</p>
      </div>
      
      <div class="block-title">Channel: <strong id="room-name-display">default</strong></div>
      
      <div class="block-title">Connected Devices</div>
      <div class="list inset list-strong-ios list-dividers-ios" id="device-list">
        <ul></ul>
      </div>
      <div class="block" id="no-devices">
        <p><i class="f7-icons search-icon">arrow_clockwise</i> <span id="search-text">Searching for devices in channel...</span></p>
      </div>
    </div>
  </div>
</template>

<!-- component styles -->
<style>
  #device-list .item-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #device-list .device-info {
    flex: 1;
  }

  #device-list .device-id {
    font-size: 0.9em;
    color: #666;
  }

  #device-list .play-button {
    /* margin-left: 10px;
    padding: 4px 12px;
    font-size: 13px;
    min-height: 28px; */
  }

  .connection-status {
    padding: 10px 15px;
    text-align: center;
    font-size: 0.9em;
    color: #666;
  }

  .search-icon {
    display: inline-block;
    font-size: 16px;
    vertical-align: middle;
    margin-right: 4px;
  }

  .search-icon.searching {
    animation: rotate 1s linear infinite;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<!-- component logic -->
<script>
  export default (props, { $f7, $on }) => {
    let peer = null;
    let connections = {};
    let connectionAttempts = {}; // Track attempted connections with timestamps
    let pollInterval = null;
    const remoteChannel = appData.global.remote_channel || 'default';
    const knownDevices = ['player1', 'player2', 'player3', 'player4', 'player5']; // Try connecting to these device slots
    const RETRY_DELAY = 2000; // Retry failed connections after 2 seconds

    function updateDeviceList() {
      const deviceList = $$('#device-list ul');
      const noDevices = $$('#no-devices');
      
      const connectedDevices = Object.keys(connections);
      
      if (connectedDevices.length === 0) {
        deviceList.html('');
        noDevices.show();
      } else {
        noDevices.hide();
        let html = '';
        connectedDevices.forEach((peerId) => {
          const conn = connections[peerId];
          html += `
            <li>
              <div class="item-content">
                <div class="item-inner">
                  <div class="item-title-row">
                    <div class="item-title device-id">${peerId}</div>
                  </div>
                </div>
                <div class="item-after">
                  <button class="button play-button" data-peer-id="${peerId}">
                    <i class="f7-icons">play_fill</i>
                  </button>
                </div>
              </div>
            </li>
          `;
        });
        deviceList.html(html);
        
        // Attach click handlers to play buttons
        $$('.play-button').on('click', function() {
          const peerId = $$(this).attr('data-peer-id');
          sendTrigger(peerId);
        });
      }
    }

    function sendTrigger(peerId) {
      const conn = connections[peerId];
      if (conn && conn.open) {
        conn.send('go');
        console.log('Sent "go" trigger to:', peerId);
        $f7.toast.create({
          text: 'Trigger sent!',
          closeTimeout: 2000,
        }).open();
      } else {
        console.error('Connection not open for peer:', peerId);
        $f7.toast.create({
          text: 'Connection not available',
          closeTimeout: 2000,
        }).open();
      }
    }

    function connectToPeer(peerId) {
      // Check if we already have a connection
      if (connections[peerId]) {
        return;
      }

      // Check if we have a recent failed attempt (within retry delay)
      const lastAttempt = connectionAttempts[peerId];
      if (lastAttempt && (Date.now() - lastAttempt < RETRY_DELAY)) {
        return; // Too soon to retry
      }

      // Mark this peer with timestamp
      connectionAttempts[peerId] = Date.now();

      const conn = peer.connect(peerId);
      
      conn.on('open', () => {
        console.log('✓ Connected to device:', peerId);
        connections[peerId] = conn;
        delete connectionAttempts[peerId]; // Clear attempt marker on success
        updateDeviceList();
      });

      conn.on('close', () => {
        console.log('Disconnected from:', peerId);
        delete connections[peerId];
        delete connectionAttempts[peerId]; // Clear so we can reconnect
        updateDeviceList();
      });

      conn.on('error', (err) => {
        // Silently handle connection errors - devices may not be online yet
        // Only log if it's not a "peer unavailable" error
        if (err.type !== 'peer-unavailable') {
          console.warn('Connection error to', peerId, ':', err.type);
        }
        delete connections[peerId];
        // Keep the timestamp in connectionAttempts - it will allow retry after RETRY_DELAY
      });
    }

    function pollForDevices() {
      console.log('🔍 Polling for devices in channel:', remoteChannel);
      
      // Show searching animation (safe check)
      const searchIcon = $$('.search-icon');
      if (searchIcon.length > 0) {
        searchIcon.addClass('searching');
        
        // Stop animation after a brief moment
        setTimeout(() => {
          searchIcon.removeClass('searching');
        }, 500);
      }
      
      // Try connecting to predictable peer IDs based on remote channel
      knownDevices.forEach((deviceSlot) => {
        const targetPeerId = `simphoney-${remoteChannel}-${deviceSlot}`;
        if (!connections[targetPeerId] && targetPeerId !== peer.id) {
          connectToPeer(targetPeerId);
        }
      });
    }

    $on('pageAfterIn', function (e, page) {
      console.log('Remote control page displayed for channel:', remoteChannel);
      $$('#room-name-display').text(remoteChannel);

      // Check WebRTC support
      const hasWebRTC = !!(window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection);
      if (!hasWebRTC) {
        console.error('WebRTC not available');
        $f7.dialog.alert('WebRTC is disabled. In Brave, go to Settings → Shields and set Fingerprinting to "Standard"', 'WebRTC Disabled');
        return;
      }

      // Initialize PeerJS with random ID
      try {
        peer = new Peer({
          debug: 0
        });
      } catch (err) {
        console.error('Failed to create peer:', err);
        $f7.dialog.alert('Failed to initialize remote control. Please check browser settings.', 'Connection Error');
        return;
      }

      peer.on('open', (id) => {
        console.log('Remote controller PeerJS ID:', id);
        
        // Start polling for devices every 3 seconds
        pollInterval = setInterval(pollForDevices, 3000);
        
        // Do an immediate poll
        pollForDevices();
      });

      peer.on('error', (err) => {
        // Only log non-routine errors
        if (err.type === 'peer-unavailable') {
          // Silently ignore - device just isn't online
          return;
        }
        
        console.error('PeerJS error:', err);
        
        // Show user-friendly error for WebRTC issues
        if (err.type === 'unavailable-id') {
          console.warn('Peer ID conflict');
        } else if (err.type === 'browser-incompatible' || err.type === 'webrtc') {
          $f7.dialog.alert('WebRTC error. In Brave: Settings → Shields → Fingerprinting → "Standard"', 'WebRTC Issue');
        }
      });
    });

    $on('pageBeforeOut', function (e, page) {
      // Clean up when leaving the page
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }

      // Close all connections
      Object.keys(connections).forEach((peerId) => {
        if (connections[peerId] && !connections[peerId].disconnected) {
          connections[peerId].close();
        }
      });
      connections = {};
      connectionAttempts = {};

      // Destroy peer
      if (peer) {
        peer.destroy();
        peer = null;
      }

      console.log('Remote control disconnected');
    });

    // component function must return render function
    return $render;
  };
</script>
