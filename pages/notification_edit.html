<!-- component logic -->
<script>
    export default (props, { $f7, $on }) => {
        console.log("notification edit component loaded");
        const updateNotificationSettings = () => {
            const $settings = $$('form.list.settings');
            try {
                if (appData.currentSim) {
                    appData.currentSim.name = $settings.find('input[name="name"]').val();
                    appData.currentSim.sender_name = $settings.find('input[name="sender_name"]').val();
                    appData.currentSim.message = $settings.find('input[name="message"]').val();
                    appData.currentSim.sent_time = $settings.find('input[name="sent_time"]').val();
                    appData.currentSim.trigger_type = $settings.find('select[name="trigger_type"]').val();
                    appData.currentSim.delay = $settings.find('input[name="delay"]').val();
                    console.log('Notification settings updated:', appData.currentSim);
                    appData.sims[appData.currentSim.id] = appData.currentSim;
                    saveAppData();
                }
            } catch (error) {
                console.log("Error updating notification settings:", error);
            }
        };

        const setupSenderImageUpload = () => {
            const fileInput = $$('#sender_image_upload');
            const previewImg = $$('#sender_image_preview');

            if (appData.currentSim.sender_image && appData.currentSim.sender_image.startsWith('data:')) {
                previewImg.attr('src', appData.currentSim.sender_image);
            }

            fileInput.on('change', function (e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    imageFileToBase64(file)
                        .then((base64Data) => {
                            previewImg.attr('src', base64Data);
                            appData.currentSim.sender_image = base64Data;
                            console.log('Sender image uploaded and stored successfully');
                        })
                        .catch((error) => {
                            app.notification.create({
                                title: 'Error',
                                text: 'Failed to upload image',
                                closeTimeout: 2000,
                                closeOnClick: true,
                            }).open();
                            console.error('Error uploading image:', error);
                        });
                } else {
                    app.notification.create({
                        title: 'Invalid File',
                        text: 'Please select a valid image file',
                        closeTimeout: 2000,
                        closeOnClick: true,
                    }).open();
                }
            });

            previewImg.on('click', function (e) {
                fileInput.val('');
                appData.currentSim.sender_image = generateRandomAvatar();
                previewImg.attr('src', appData.currentSim.sender_image);
                console.log('image reset');
            });
        };

        $on('pageInit', function (e, page) {
            setupSenderImageUpload();
        });

        $on('pageBeforeIn', function (e, page) {
            const s = appData.currentSim;
            console.log('notification edit page displayed...', s);
            const $settings = $$('form.list.settings');
            $settings.find('input[name="name"]').val(s.name);
            $settings.find('input[name="sender_name"]').val(s.sender_name);
            $settings.find('input[name="message"]').val(s.message);
            $settings.find('input[name="sent_time"]').val(s.sent_time);
            $settings.find('input[name="delay"]').val(s.delay);
            $settings.find('select[name="trigger_type"]').val(s.trigger_type);
        });

        $on('pageBeforeOut', function (e, page) {
            updateNotificationSettings();
        });

        // component function must return render function
        return $render;
    };
</script>
