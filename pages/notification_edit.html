<!-- component styles -->
<style>

    #sender_avatar_preview {

<!-- component logic -->
<script>
    export default (props, { $f7, $on }) => {
        console.log("notification edit component loaded");
        const updateNotificationSettings = () => {
            const $settings = $$('form.list.settings');
            try {
                if (currentSim) {
                    currentSim.name = $settings.find('input[name="name"]').val();
                    // Update sender fullname and split into first/last
                    const senderFullname = $settings.find('input[name="sender_fullname"]').val();
                    const nameParts = senderFullname.split(' ');
                    currentSim.sender.name.first = nameParts[0] || '';
                    currentSim.sender.name.last = nameParts.slice(1).join(' ') || '';
                    currentSim.sender.fullname = senderFullname;
                    currentSim.message = $settings.find('input[name="message"]').val();
                    currentSim.sent_time = $settings.find('input[name="sent_time"]').val();
                    currentSim.trigger_type = $settings.find('select[name="trigger_type"]').val();
                    currentSim.delay = $settings.find('input[name="delay"]').val();
                    currentSim.clock_time = $settings.find('input[name="clock_time"]').val();
                    currentSim.background_type = $settings.find('select[name="background_type"]').val();
                    currentSim.website_url = $settings.find('input[name="website_url"]').val();
                    currentSim.sound_enabled = $settings.find('input[name="sound_enabled"]').prop('checked');
                    currentSim.vibration_enabled = $settings.find('input[name="vibration_enabled"]').prop('checked');
                    console.log('Notification settings updated:', currentSim);
                    appData.sims[currentSim.id] = currentSim;
                    saveAppData();
                }
            } catch (error) {
                console.log("Error updating notification settings:", error);
            }
        };

        const playThisSim = () => {
            updateNotificationSettings();
            console.log("Playing this sim now:", currentSim);
            enterFullscreen();
            mainView.router.navigate('/' + currentSim.type + '/');
        }

        const setupSenderImageUpload = () => {
            const fileInput = $$('#sender_avatar_upload');
            const previewImg = $$('#sender_avatar_preview');

            if (currentSim.sender.picture.medium && currentSim.sender.picture.medium.startsWith('data:')) {
                previewImg.css('background-image', `url(${currentSim.sender.picture.medium})`);
            }

            fileInput.on('change', function (e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    // imageFileToBase64(file)
                    resizeImageToBase64(file)
                        .then((base64Data) => {
                            previewImg.css('background-image', `url(${base64Data})`);
                            currentSim.sender.picture.medium = base64Data;
                            console.log('Sender image uploaded and stored successfully');
                        })
                        .catch((error) => {
                            app.notification.create({
                                title: 'Error',
                                text: 'Failed to upload image',
                                closeTimeout: 2000,
                                closeOnClick: true,
                            }).open();
                            console.error('Error uploading image:', error);
                        });
                } else {
                    app.notification.create({
                        title: 'Invalid File',
                        text: 'Please select a valid image file',
                        closeTimeout: 2000,
                        closeOnClick: true,
                    }).open();
                }
            });

            previewImg.on('click', function (e) {
                fileInput.val('');
                currentSim.sender.picture.medium = generateRandomAvatar();
                previewImg.css('background-image', `url(${currentSim.sender.picture.medium})`);
                console.log('image reset');
            });
        };

        const show_hide_website_url_field = () => {
            console.log('Checking background type for website URL field display');
            const backgroundType = $$('select[name="background_type"]').val();
            if (backgroundType === 'website') {
                $$('input[name="website_url"]').closest('li').show();
            } else {
                $$('input[name="website_url"]').closest('li').hide();
            }
        };

        const show_hide_delay_field = () => {
            console.log('Checking trigger type for delay field display');
            const triggerType = $$('select[name="trigger_type"]').val();
            if (triggerType === 'remote') {
                $$('#delay_field').hide();
            } else {
                $$('#delay_field').show();
            }
        };

        $on('pageInit', function (e, page) {
            setupSenderImageUpload();

            $$("#play_now_button").on('click', function (e) {
                e.preventDefault();
                playThisSim();
            });

            $$("#delete_button").on('click', function (e) {
                e.preventDefault();
                deleteThisSim();
            });

            $$('select[name="background_type"]').on('change', function () {
                show_hide_website_url_field();
            });

            $$('select[name="trigger_type"]').on('change', function () {
                show_hide_delay_field();
            });

        });

        $on('pageBeforeIn', function (e, page) {
            const s = currentSim;
            console.log('notification edit page displayed...', s);
            const $settings = $$('form.list.settings');
            $settings.find('input[name="name"]').val(s.name);
            $settings.find('input[name="sender_fullname"]').val(s.sender.fullname);
            $settings.find('input[name="message"]').val(s.message);
            $settings.find('input[name="sent_time"]').val(s.sent_time);
            $settings.find('input[name="clock_time"]').val(s.clock_time);
            $settings.find('input[name="delay"]').val(s.delay);
            $settings.find('select[name="trigger_type"]').val(s.trigger_type);
            $settings.find('select[name="background_type"]').val(s.background_type);
            $settings.find('input[name="website_url"]').val(s.website_url);
            $settings.find('input[name="sound_enabled"]').prop('checked', s.sound_enabled || false);
            $settings.find('input[name="vibration_enabled"]').prop('checked', s.vibration_enabled || false);

            $$("#sender_avatar_preview").css('background-image', `url(${s.sender.picture.medium})`);
            show_hide_website_url_field();
            show_hide_delay_field();
        });

        $on('pageBeforeOut', function (e, page) {
            updateNotificationSettings();
        });

        // component function must return render function
        return $render;
    };
</script>
