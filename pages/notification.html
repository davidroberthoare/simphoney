<!-- NOTIFICATION COMPONENT -->
<template>
  <div data-name="notification" class="page">
    <div class="navbar">
      <div class="navbar-inner">
        <div class="left">
          <a href="/" class="link back"><i class="f7-icons">chevron_left</i></a>
        </div>
      </div>
    </div>
    <div class="page-content">
      <div id="clock">${currentSim.clock_time}</div>
      <iframe id="website" src=""></iframe>
    </div>
  </div>
</template>

<!-- component styles -->
<style>
  /* Add custom styles here if needed */
  #clock {
    width: 100%;
    text-align: center;
    font-size: 4em;
    color: white;
    text-shadow: 4px 2px 5px #00000052;
    margin-top: 10vh;
    display: none;
  }

  #website {
    position: absolute;
    top: 0;
    width: 100%;
    left: 0;
    height: 100%;
    overflow: hidden;
    border: 0px;
    display: none;
  }
</style>

<!-- component logic -->
<script>
  export default (props, { $f7, $on }) => {
    let peer = null;
    let peerId = null;
    const remoteChannel = appData.global.remote_channel || 'default';

    // Function to trigger the notification
    function triggerNotification() {
      // Play sound effect if enabled
      if (currentSim.sound_enabled) {
        playNotificationSound();
      }
      
      // Trigger vibration if enabled
      if (currentSim.vibration_enabled) {
        triggerVibration();
      }
      
      let notification = app.notification.create({
        icon: `<div class="avatar" style="background-image: url('${currentSim.sender.picture.medium}');"></div>`,
        title: currentSim.sender.fullname,
        titleRightText: currentSim.sent_time,
        text: currentSim.message,
        closeOnClick: true,
        swipeToClose: true,
      });
      notification.open();
    }

    $on('pageBeforeIn', function (e, page) {
      console.log('Preparing notification page...');
      if (!currentSim || currentSim.type !== 'notification') {
        console.error('No valid notification sim');
        return;
      }
      
      // Preload alert sound if enabled
      if (currentSim.sound_enabled) {
        const alertSound = appData.global.alert_sound || 'alert1';
        preloadSound(`sounds/${alertSound}.mp3`, alertSound);
      }
      
      if (appData.global.background_img) {
        $$('.page[data-name="notification"]').css('background-image', `url(${appData.global.background_img})`);
      } else {
        $$('.page[data-name="notification"]').css('background-image', 'none');
      }
    });

    $on('pageAfterIn', function (e, page) {
      console.log('play page displayed...', currentSim);
      if (!currentSim || currentSim.type !== 'notification') {
        console.error('No valid notification sim');
        return;
      }

      // hide/show various elements based on SIM settings
      // show the website if it's set
      if (currentSim.background_type === 'website' && currentSim.website_url.trim() !== '') {
        $$('#website').attr('src', currentSim.website_url);
        $$('#website').show();
      }
      else if (currentSim.background_type === 'lockscreen') {
        //  if it's the lock screen, hide the website
        $$('#website').hide();

        // show the clock if it's set
        if (currentSim.clock_time && currentSim.clock_time.trim() !== '') {
          $$('#clock').show();

        } else {
          $$('#clock').hide();
        }
      }


      // Original timed trigger, only if type == 'delay'
      if (currentSim.trigger_type === 'timed') {
        setTimeout(() => {
          triggerNotification();
        }, currentSim.delay * 1000);
      }
      else {  //for 'remote' trigger type

        // Get player slot from global settings
        let playerSlot = appData.global.player_slot || 'player1';

        // Initialize PeerJS with predictable ID for auto-discovery
        peerId = `simphoney-${remoteChannel}-${playerSlot}`;
        peer = new Peer(peerId);

        peer.on('open', (id) => {
          console.log(`PeerJS connected - Channel: ${remoteChannel}, Slot: ${playerSlot}, ID: ${id}`);
        });

        peer.on('connection', (conn) => {
          console.log('Remote connection established');
          conn.on('data', (data) => {
            console.log('Received data from remote:', data);
            if (data === 'go') {
              triggerNotification();
            }
          });
        });

        peer.on('error', (err) => {
          console.error('PeerJS error:', err);
        });

      }




    });

    $on('pageBeforeOut', function (e, page) {
      // Clean up PeerJS connection when leaving the page
      if (peer) {
        peer.destroy();
        peer = null;
        peerId = null;
        localStorage.removeItem('simphoney_peer_id');
        console.log('PeerJS connection closed');
      }
    });

    // component function must return render function
    return $render;
  };
</script>
