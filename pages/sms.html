<!-- SMS COMPONENT -->
<template>
  <div data-name="sms" class="page">
    <div class="navbar">
      <div class="navbar-inner">
        <div class="left">
          <a href="/" class="link back"><i class="f7-icons">chevron_left</i></a>
        </div>
      </div>
    </div>



    <div class="page-content messages-content">
      <div class="messages">
        <div class="messages-title"></div>

      </div>
    </div>


    <!-- <div class="template message message-received"> -->
    <div class="template message">
      <div class="message-avatar" style="background-image:url(https://cdn.framework7.io/placeholder/people-100x100-9.jpg)"></div>
      <div class="message-content">
        <div class="message-name"><span class="name"></span><span class="time"></span></div>
        <div class="message-bubble">
          <div class="message-text">Message goes here</div>
        </div>
      </div>
    </div>



    <div class="toolbar toolbar-bottom messagebar messagebar-init">
      <div class="toolbar-inner">
        <div class="toolbar-pane">
          <a class="link icon-only">
            <i class="icon f7-icons">camera_fill</i>
          </a>
        </div>
        <div class="messagebar-area">
          <textarea  class="resizable" id="message_text"></textarea>
        </div>
        <div class="toolbar-pane">
          <a class="link icon-only demo-send-message-link" @click=${sendMessage}>
            <i class="icon f7-icons">arrow_up_circle_fill</i>
          </a>
        </div>
      </div>
    </div>




  </div>
</template>

<!-- component styles -->
<style>
  .template.message {
    display: none;
  }

  .messagebar textarea{
    scrollbar-width: none;
  }

  .message-name .time {
    font-size: 0.8em;
    color: #888;
    margin-left: 5px;
  }

  .page[data-name="sms"] {
    --sms-keyboard-height: 0px;
  }

  .page[data-name="sms"] .messages-content {
    padding-bottom: calc(var(--f7-messagebar-height, 44px) + var(--sms-keyboard-height));
  }

  .page[data-name="sms"] .toolbar.messagebar {
    transform: translate3d(0, calc(-1 * var(--sms-keyboard-height)), 0);
  }
</style>

<!-- component logic -->
<script>
  export default (props, { $f7, $el, $on, $ }) => {
    console.log("sim", currentSim);

    let responseInProgress = false;
    let messagebar;
    let messages;
    let messageCounter = 0;



    const sendMessage = () => {
      var text = messagebar.getValue().replace(/\n/g, '<br />').trim();
      var messagesToSend = [];

      if (text.trim().length) {
        messagesToSend.push({
          text: text
        });
      }

      // Clear area
      messagebar.clear();
      // Focus area
      if (text.length) messagebar.focus();
      // Exit when nothing to send
      if (!messagesToSend.length) return;

      // Send message
      messages.addMessages(messagesToSend);

      // Mock response
      if (responseInProgress) return;
      responseInProgress = true;

      // if there's no more response messages to send, exit
      if (messageCounter >= currentSim.messages.length) {
        //no more messages to send
        responseInProgress = false;
        return;
      }
      doResponses();
    }


    //process any responses and reset for next sent message
    const doResponses = () => {
      if (messageCounter >= currentSim.messages.length) {
        responseInProgress = false;
        return;
      }

      // this is the next message to respond with
      const msg = currentSim.messages[messageCounter];
      messageCounter++;
      var person = currentSim.senders[msg.from];

      //set a delay timer for showing their response typing
      setTimeout(function () {
        messages.showTyping({
          header: person.name + ' is typing',
          avatar: person.avatar
        });

        //then start the delay timer for sending their message
        setTimeout(function () {
          messages.addMessage({
            text: msg.text,
            type: 'received',
            name: person.name,
            avatar: person.avatar
          });
          messages.hideTyping();
          responseInProgress = false;

          //if this message has autofollow, process the next response too
          if (msg.autofollow) {
            doResponses();
          }

        }, msg.delay * 1000); //after their delay time

      }, 1000); //they don't start typing straight away




    }



    $on('pageInit', () => {

      //setup all messages based on the prefilled sim data
      currentSim.prefilled.forEach(m => {
        let $$m = $$($$(".template.message")[0].cloneNode(true));
        console.log("message", m);
        $$m.removeClass("template");
        $$m.find(".message-text").text(m.text);
        if (m.from === "me") {
          $$m.addClass("message-sent");
          $$m.find(".message-avatar").remove();
          $$m.find(".message-name").remove();
        } else {
          $$m.addClass("message-received");
          $$m.find(".message-name .name").text(currentSim.senders[m.from].name);
          // $$m.find(".message-name .time").text(m.time ? `~ ${m.time}` : "");
          $$m.find(".message-avatar").css("background-image", "url(" + currentSim.senders[m.from].avatar + ")");
        }
        if(m.time){
          $$(".messages").append(`<div class="messages-title">${m.time}</div>`);
        }
        $$(".messages").append($$m);
      });

      messagebar = $f7.messagebar.create({
        el: $el.value.find('.messagebar'),
        attachments: []
      });
      messages = $f7.messages.create({
        //find all messages elements, except the 'template' ones
        el: $el.value.find('.messages:not(.template)'),
        firstMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!previousMessage || previousMessage.type !== message.type || previousMessage.name !== message.name) return true;
          return false;
        },
        lastMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!nextMessage || nextMessage.type !== message.type || nextMessage.name !== message.name) return true;
          return false;
        },
        tailMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!nextMessage || nextMessage.type !== message.type || nextMessage.name !== message.name) return true;
          return false;
        }
      });

      $$("#message_text").keypress(function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });



      // THIS IS JUST FOR SCROLLING TEXTBAR INTO VIEW WHEN KEYBOARD OPENS
      // Use Visual Viewport API for Chromium-based browsers
      const pageEl = $el.value.find('.page')[0];
      const textareaEl = $$("#message_text")[0];
      const visualViewport = window.visualViewport;
      
      const setKeyboardHeight = (height) => {
        if (!pageEl) return;
        pageEl.style.setProperty('--sms-keyboard-height', `${height || 0}px`);
        console.log('Setting keyboard height:', height);
      };

      const updateKeyboardState = () => {
        if (!visualViewport) return;
        
        const windowHeight = window.innerHeight;
        const viewportHeight = visualViewport.height;
        const keyboardHeight = Math.max(0, windowHeight - viewportHeight);
        
        console.log('Window height:', windowHeight, 'Viewport height:', viewportHeight, 'Keyboard:', keyboardHeight);
        setKeyboardHeight(keyboardHeight);
        
        // Scroll the textarea into view when keyboard opens
        if (keyboardHeight > 0 && textareaEl) {
          setTimeout(() => {
            textareaEl.scrollIntoView({ behavior: 'instant', block: 'center' });
          }, 150);
        }
      };

      if (visualViewport) {
        visualViewport.addEventListener('resize', updateKeyboardState);
        visualViewport.addEventListener('scroll', updateKeyboardState);
      }
      
      // END SCROLLING TEXTBAR INTO VIEW WHEN KEYBOARD OPENS



      $on('pageBeforeRemove', () => {
        if (visualViewport) {
          visualViewport.removeEventListener('resize', updateKeyboardState);
          visualViewport.removeEventListener('scroll', updateKeyboardState);
        }
        setKeyboardHeight(0);
      });


    });
    //end page init



    // MY STUFF...

    $on('pageBeforeIn', function (e, page) {
      console.log('Preparing page...');

    });

    $on('pageAfterIn', function (e, page) {
      console.log('page displayed...', currentSim);
      // hide/show various elements based on SIM settings

    });

    // component function must return render function
    return $render;
  };
</script>
