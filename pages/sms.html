<!-- component logic -->
<script>
  export default (props, { $f7, $el, $on, $ }) => {
    console.log("sim", currentSim);

    let responseInProgress = false;
    let messagebar;
    let messages;
    let messageCounter = 0;
    let notificationShown = false;

    // Function to trigger the SMS notification
    function triggerSMSNotification() {
      // Hide blank overlay if it was shown
      $$('#blank_overlay').hide();

      // Play sound effect if enabled
      if (currentSim.sound_enabled) {
        playSMSSound();
      }

      // Trigger vibration if enabled
      if (currentSim.vibration_enabled) {
        triggerVibration();
      }

      // Get the last prefilled message
      const lastMessage = currentSim.prefilled[currentSim.prefilled.length - 1];
      const sender = currentSim.senders[lastMessage.from];

      let notification = app.notification.create({
        icon: `<div class="avatar" style="background-image: url('${sender.picture.medium}');"></div>`,
        title: sender.fullname,
        titleRightText: lastMessage.time || 'now',
        text: lastMessage.text,
        closeOnClick: true,
        swipeToClose: true,
        on: {
          close: function () {
            // Show the full SMS interface when notification is closed
            showSMSInterface();
          }
        }
      });
      notification.open();
      notificationShown = true;
    }

    // Function to show the SMS interface
    function showSMSInterface() {
      // Show the messages interface
      $$('.messages').show();
      $$('.messagebar').show();
      $$('.page[data-name="sms"] .page-content').css('background-image', 'none');
      $$('#website').hide();
    }


    const sendMessage = () => {
      // Hide blank overlay when user starts interacting (sending first message)
      $$('#blank_overlay').hide();

      // If notification mode and user is typing, ensure interface is shown
      if (!notificationShown && currentSim.prefilled && currentSim.prefilled.length > 0) {
        showSMSInterface();
      }

      var text = messagebar.getValue().replace(/\n/g, '<br />').trim();
      var messagesToSend = [];

      if (text.trim().length) {
        messagesToSend.push({
          text: text
        });
      }

      // Clear area
      messagebar.clear();
      // Focus area
      if (text.length) messagebar.focus();
      // Exit when nothing to send
      if (!messagesToSend.length) return;

      // Send message
      messages.addMessages(messagesToSend);

      // Mock response
      if (responseInProgress) return;
      responseInProgress = true;

      // if there's no more response messages to send, exit
      if (messageCounter >= currentSim.messages.length) {
        //no more messages to send
        responseInProgress = false;
        return;
      }
      // only if this is a 'timed' trigger type
      if (currentSim.trigger_type === 'timed') {
        doResponses();
      }
    }


    //process any responses and reset for next sent message
    const doResponses = (initialDelay = 1) => {
      if (messageCounter >= currentSim.messages.length) {
        responseInProgress = false;
        return;
      }

      // this is the next message to respond with
      const msg = currentSim.messages[messageCounter];
      messageCounter++;
      var person = currentSim.senders[msg.from];

      //set a delay timer for showing their response typing
      setTimeout(function () {
        messages.showTyping({
          header: person.fullname + ' is typing',
          avatar: person.picture.medium
        });

        //then start the delay timer for sending their message
        setTimeout(function () {
          // Play sound and vibration when message arrives
          if (currentSim.sound_enabled) {
            playSMSSound();
          }
          if (currentSim.vibration_enabled) {
            triggerVibration();
          }

          messages.addMessage({
            text: msg.text,
            type: 'received',
            name: person.fullname,
            avatar: person.picture.medium
          });
          messages.hideTyping();
          responseInProgress = false;

          //if this message has autofollow, process the next response too
          if (msg.autofollow) {
            doResponses();
          }

        }, msg.delay * 1000); //after their delay time

      }, 1000 * initialDelay); //they don't start typing straight away




    }



    $on('pageInit', () => {

      // Preload alert sound if enabled
      if (currentSim.sound_enabled) {
        const alertSound = appData.global.alert_sound || 'alert1';
        preloadSound(`sounds/${alertSound}.mp3`, alertSound);
      }



      //setup all messages based on the prefilled sim data
      currentSim.prefilled.forEach(m => {
        let $$m = $$($$(".template.message")[0].cloneNode(true));
        console.log("message", m);
        $$m.removeClass("template");
        $$m.find(".message-text").text(m.text);
        if (m.from === "me") {
          $$m.addClass("message-sent");
          $$m.find(".message-avatar").remove();
          $$m.find(".message-name").remove();
        } else {
          $$m.addClass("message-received");
          $$m.find(".message-name .name").text(currentSim.senders[m.from].fullname);
          // $$m.find(".message-name .time").text(m.time ? `~ ${m.time}` : "");
          $$m.find(".message-avatar").css("background-image", "url(" + currentSim.senders[m.from].picture.thumbnail + ")");
        }
        if (m.time) {
          $$(".messages").append(`<div class="messages-title">${m.time}</div>`);
        }
        $$(".messages").append($$m);
      });





      // Initialize messagebar and messages first
      messagebar = $f7.messagebar.create({
        el: $el.value.find('.messagebar'),
        attachments: []
      });
      messages = $f7.messages.create({
        //find all messages elements, except the 'template' ones
        el: $el.value.find('.messages:not(.template)'),
        firstMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!previousMessage || previousMessage.type !== message.type || previousMessage.name !== message.name) return true;
          return false;
        },
        lastMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!nextMessage || nextMessage.type !== message.type || nextMessage.name !== message.name) return true;
          return false;
        },
        tailMessageRule: function (message, previousMessage, nextMessage) {
          if (message.isTitle) return false;
          if (!nextMessage || nextMessage.type !== message.type || nextMessage.name !== message.name) return true;
          return false;
        }
      });

      // Check if there are prefilled messages to show as notification
      const hasPrefilledMessages = currentSim.prefilled && currentSim.prefilled.length > 0;

      if (!hasPrefilledMessages) {
        // No prefilled messages - go straight to SMS interface
        $$('.messages').show();
        $$('.messagebar').show();
      } else {
        // Has prefilled messages - hide interface initially to show notification first
        $$('.messages').hide();
        $$('.messagebar').hide();
      }

      $$("#message_text").keypress(function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });






      $on('pageBeforeRemove', () => {
        if (visualViewport) {
          visualViewport.removeEventListener('resize', updateMessagebarPosition);
          visualViewport.removeEventListener('scroll', updateMessagebarPosition);
        }

        // Clean up PeerJS connection
        cleanupPeerConnection();
      });


    });
    //end page init



    // MY STUFF...

    $on('pageBeforeIn', function (e, page) {
      console.log('Preparing page...');

      // Set background image if configured
      if (appData.global.background_img) {
        $$('.page[data-name="sms"] .page-content').css('background-image', `url(${appData.global.background_img})`);
        $$('.page[data-name="sms"] .page-content').css('background-size', 'cover');
        $$('.page[data-name="sms"] .page-content').css('background-position', 'center');
      } else {
        $$('.page[data-name="sms"] .page-content').css('background-image', 'none');
      }
    });

    $on('pageAfterIn', function (e, page) {
      console.log('page displayed...', currentSim);

      // Check if there are prefilled messages
      const hasPrefilledMessages = currentSim.prefilled && currentSim.prefilled.length > 0;

      // Handle background display based on settings
      if (currentSim.background_type === 'blank') {
        // Show blank (phone off) overlay
        $$('#blank_overlay').show();
        $$('#website').hide();
        $$('#clock').hide();
      } else if (currentSim.background_type === 'website' && currentSim.website_url && currentSim.website_url.trim() !== '') {
        $$('#blank_overlay').hide();
        $$('#website').attr('src', currentSim.website_url);
        $$('#website').show();
      } else if (currentSim.background_type === 'lockscreen') {
        $$('#blank_overlay').hide();
        $$('#website').hide();

        // Show clock if configured
        if (currentSim.clock_time && currentSim.clock_time.trim() !== '') {
          $$('#clock').text(currentSim.clock_time).show();
        } else {
          $$('#clock').hide();
        }
      }

      // Handle notification trigger if there are prefilled messages
      if (hasPrefilledMessages) {
        if (currentSim.trigger_type === 'timed') {
          // Timed trigger - show notification after delay
          setTimeout(() => {
            triggerSMSNotification();
          }, currentSim.delay * 1000);
        } else if (currentSim.trigger_type === 'remote') {
          // Remote mode: set up PeerJS with a callback that handles both notification and subsequent messages
          initializePeerConnection(() => {
            if (!notificationShown) {
              // First trigger - show notification
              triggerSMSNotification();
            } else {
              // Subsequent triggers - trigger next message response
              doResponses(0);
            }
          });
        }
      } else {
        // No prefilled messages - hide blank overlay immediately if present
        $$('#blank_overlay').hide();

        // Still set up remote trigger for subsequent messages if needed
        if (currentSim.trigger_type === 'remote') {
          initializePeerConnection(() => {
            doResponses(0);
          });
        }
      }

    });

    // component function must return render function
    return $render;
  };
</script>
