<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2196f3">
  <link rel="manifest" href="manifest.json">
  <title>SimPhoney</title>
  <link rel="stylesheet" href="https://unpkg.com/framework7@9.0.2/framework7-bundle.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- App root element -->
  <div id="app">
    <!-- Main view -->
    <div class="view view-main view-init" data-url="/"></div>
  </div>

  <script src="https://unpkg.com/framework7@9.0.2/framework7-bundle.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="utils.js"></script>
  <script src="default.js"></script>
  <script src="app.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('[App] Service Worker registered:', registration.scope);
          })
          .catch(error => {
            console.log('[App] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
